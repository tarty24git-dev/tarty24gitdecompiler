apiVersion: apps/v1
kind: Deployment
metadata:
  name: cth-trade-finance
  labels:
    app: cth-trade-finance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cth-trade-finance
  template:
    metadata:
      labels:
        app: cth-trade-finance
    spec:
      containers:
      - name: cth-trade-finance
        image: cth-trade-finance:1.0.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "8Gi"
            cpu: "2000m"
        envFrom:
        - configMapRef:
            name: cth-trade-finance-config
---
apiVersion: v1
kind: Service
metadata:
  name: cth-trade-finance-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: cth-trade-finance
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cth-trade-finance-config
data:
  SPRING_PROFILES_ACTIVE: "h2"
  CTH_SECURITY_MFA_ENABLED: "false"
  CTH_SECURITY_LDAP_ENABLED: "false"
