<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - CTH Trade Finance Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-login { border: none; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        .btn-primary { background-color: #1e3c72; border: none; }
        .btn-primary:hover { background-color: #2a5298; }
    </style>
</head>
<body>
    <div class="card card-login p-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">CTH Trade Finance</h3>
            <p class="text-muted fs-7">Finastra TI Plus Profitability & Decompiler</p>
        </div>
        <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
            Invalid username or password!
        </div>
        <div th:if="${param.logout}" class="alert alert-info py-2" role="alert">
            You have been logged out.
        </div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username (default: admin)" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password (default: Qwerty123$)" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Sign In</button>
        </form>
    </div>
</body>
</html>
