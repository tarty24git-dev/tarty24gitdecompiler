<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Custom Reports - CTH Trade Finance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { min-height: 100vh; background-color: #1e293b; color: white; }
        .sidebar a { color: #94a3b8; text-decoration: none; display: block; padding: 12px 20px; border-radius: 6px; margin-bottom: 4px; }
        .sidebar a:hover, .sidebar a.active { background-color: #334155; color: white; }
        .card-custom { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
            <h4 class="text-white fw-bold mb-4 ps-2"><i class="bi bi-cpu"></i> CTH Finance</h4>
            <a href="/"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a href="/decompiler"><i class="bi bi-file-earmark-code me-2"></i> JAR Decompiler</a>
            <a href="/profitability"><i class="bi bi-graph-up-arrow me-2"></i> Profitability</a>
            <a href="/reports" class="active"><i class="bi bi-table me-2"></i> Custom Reports</a>
            <a href="/users"><i class="bi bi-people me-2"></i> Users & Config</a>
            <a href="/swagger-ui.html" target="_blank"><i class="bi bi-journal-code me-2"></i> Swagger UI</a>
            <hr class="text-secondary my-4">
            <a href="/logout" class="text-danger"><i class="bi bi-box-arrow-right me-2"></i> Logout</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">
            <h2 class="fw-bold mb-4">Configurable Dynamic Report Builder</h2>

            <!-- Report Builder Form -->
            <div class="card card-custom p-4 bg-white mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-funnel text-primary me-2"></i> Select Table and Fields</h5>
                <form id="reportForm">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Available Tables</label>
                            <select id="entitySelect" class="form-select" onchange="onEntityChange()">
                                <option value="">-- Select Table --</option>
                                <option th:each="entry : ${schemaMap}" th:value="${entry.key}" th:text="${entry.key}"></option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Available Fields (Hold Ctrl/Cmd to multi-select)</label>
                            <select id="fieldSelect" class="form-select" multiple style="height: 120px;"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Filter Field (Optional)</label>
                            <select id="filterFieldSelect" class="form-select"></select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Filter Value (Optional)</label>
                            <input type="text" id="filterValueInput" class="form-control" placeholder="Search keyword...">
                        </div>
                        <div class="col-md-4 d-flex align-items-end gap-2">
                            <button type="submit" class="btn btn-primary w-50"><i class="bi bi-play-fill me-1"></i> Generate</button>
                            <button type="button" class="btn btn-outline-success w-50" onclick="exportReportCsv()"><i class="bi bi-download me-1"></i> Export CSV</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Report Result Table -->
            <div class="card card-custom p-4 bg-white mb-4">
                <h5 class="fw-bold mb-3"><i class="bi bi-grid-3x3-gap me-2"></i> Report Results</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="resultTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody">
                            <tr><td class="text-muted">No report generated yet. Select table and fields above.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const schemaMap = /*[[${schemaMap}]]*/ {};
    /*]]>*/

    function onEntityChange() {
        const entity = document.getElementById('entitySelect').value;
        const fieldSelect = document.getElementById('fieldSelect');
        const filterSelect = document.getElementById('filterFieldSelect');

        fieldSelect.innerHTML = '';
        filterSelect.innerHTML = '<option value="">-- No Filter --</option>';

        if (entity && schemaMap[entity]) {
            schemaMap[entity].forEach(f => {
                const opt1 = document.createElement('option');
                opt1.value = f; opt1.innerText = f; opt1.selected = true;
                fieldSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = f; opt2.innerText = f;
                filterSelect.appendChild(opt2);
            });
        }
    }

    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const entityName = document.getElementById('entitySelect').value;
        const selectedFields = Array.from(document.getElementById('fieldSelect').selectedOptions).map(o => o.value);
        const filterField = document.getElementById('filterFieldSelect').value;
        const filterValue = document.getElementById('filterValueInput').value;

        if (!entityName) return alert('Please select a table');

        fetch('/api/reports/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ entityName, fields: selectedFields, filterField, filterValue })
        })
        .then(res => res.json())
        .then(data => {
            renderTable(data);
        });
    });

    function renderTable(data) {
        const thead = document.getElementById('tableHead');
        const tbody = document.getElementById('tableBody');
        thead.innerHTML = ''; tbody.innerHTML = '';

        if (!data.headers || data.headers.length === 0) return;

        const trHead = document.createElement('tr');
        data.headers.forEach(h => {
            const th = document.createElement('th');
            th.innerText = h;
            trHead.appendChild(th);
        });
        thead.appendChild(trHead);

        data.data.forEach(row => {
            const tr = document.createElement('tr');
            data.headers.forEach(h => {
                const td = document.createElement('td');
                td.innerText = row[h] != null ? row[h] : '';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
    }

    function exportReportCsv() {
        const entityName = document.getElementById('entitySelect').value;
        const selectedFields = Array.from(document.getElementById('fieldSelect').selectedOptions).map(o => o.value);
        const filterField = document.getElementById('filterFieldSelect').value;
        const filterValue = document.getElementById('filterValueInput').value;

        if (!entityName) return alert('Please select a table');

        fetch('/api/reports/export/csv', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ entityName, fields: selectedFields, filterField, filterValue })
        })
        .then(res => res.blob())
        .then(blob => {
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${entityName}_report.csv`;
            a.click();
        });
    }
</script>
</body>
</html>
