spring:
  application:
    name: CTH Trade Finance Profitability & Decompiler System
  profiles:
    active: h2
  jackson:
    serialization:
      indent_output: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: 8080

cth:
  app:
    title: CTH Trade Finance Profitability Engine
    decompiler:
      output-dir: ./decompiled_sources
  security:
    ldap:
      enabled: false
      url: ldap://localhost:389/dc=cth,dc=com
      user-dn-pattern: uid={0},ou=people
    mfa:
      enabled: false
      mode: SMS

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

---
# Profile: H2 / CSV (Default embedded)
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:cth_trade_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
# Profile: DB2
spring:
  config:
    activate:
      on-profile: db2
  datasource:
    url: jdbc:db2://localhost:50000/CTHDB
    driver-class-name: com.ibm.db2.jcc.DB2Driver
    username: db2admin
    password: db2password
  jpa:
    database-platform: org.hibernate.dialect.DB2Dialect
    hibernate:
      ddl-auto: update

---
# Profile: Oracle
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:xe
    driver-class-name: oracle.jdbc.OracleDriver
    username: cthuser
    password: cthpassword
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update

---
# Profile: PostgreSQL
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/cth_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgrespassword
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

---
# Profile: SQL Server
spring:
  config:
    activate:
      on-profile: sqlserver
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=cth_db;trustServerCertificate=true
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: sa
    password: SqlServerPassword123!
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
